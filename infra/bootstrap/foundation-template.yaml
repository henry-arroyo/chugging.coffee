AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  chugging.coffee Time Machine - security foundation (stack ctm-foundation). Owner-controlled:
  deployed and changed only by the bootstrap maintainer (the owner's administrator identity),
  never by the routine deployment roles. Creates the permission boundary every project role
  carries, and one operator role per environment that the time-machine-prod / time-machine-test
  profiles assume. DRAFT FOR OWNER REVIEW - not yet applied to any account.

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: >-
      The one IAM principal allowed to assume the operator roles: the owner's IAM user (the
      identity behind `aws login`) or IAM Identity Center role. Never the account root or a wildcard.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:(user|role)/[A-Za-z0-9+=,.@_/-]+$'
  DeploymentRegion:
    Type: String
    Default: us-east-1
    AllowedValues: [us-east-1]

Rules:
  RegionMatches:
    Assertions:
      - Assert:
          Fn::Equals: [{ Ref: AWS::Region }, { Ref: DeploymentRegion }]
        AssertDescription: Deploy the foundation in the deployment region.

Resources:
  # Ceiling for every role the project creates: operator roles, CDK deploy and file-publishing
  # roles, and CloudFormation execution roles. A role's effective permissions are the
  # intersection of this boundary and its own policies, whatever those say.
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ctm-permissions-boundary
      Description: chugging.coffee Time Machine - permission ceiling for all project roles
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ProjectStacks
            Effect: Allow
            Action: 'cloudformation:*'
            Resource:
              - Fn::Sub: arn:aws:cloudformation:${DeploymentRegion}:${AWS::AccountId}:stack/CtmProd-*/*
              - Fn::Sub: arn:aws:cloudformation:${DeploymentRegion}:${AWS::AccountId}:stack/CtmTest-*/*
          - Sid: ProjectBuckets
            Effect: Allow
            Action: 's3:*'
            Resource:
              - Fn::Sub: arn:aws:s3:::ctm-prod-site-${AWS::AccountId}
              - Fn::Sub: arn:aws:s3:::ctm-prod-site-${AWS::AccountId}/*
              - Fn::Sub: arn:aws:s3:::ctm-test-site-${AWS::AccountId}
              - Fn::Sub: arn:aws:s3:::ctm-test-site-${AWS::AccountId}/*
              - Fn::Sub: arn:aws:s3:::cdk-ctmprod-assets-${AWS::AccountId}-${DeploymentRegion}
              - Fn::Sub: arn:aws:s3:::cdk-ctmprod-assets-${AWS::AccountId}-${DeploymentRegion}/*
              - Fn::Sub: arn:aws:s3:::cdk-ctmtest-assets-${AWS::AccountId}-${DeploymentRegion}
              - Fn::Sub: arn:aws:s3:::cdk-ctmtest-assets-${AWS::AccountId}-${DeploymentRegion}/*
          - Sid: CloudFrontAndCertificates
            Effect: Allow
            Action: ['cloudfront:*', 'acm:*']
            Resource: '*'
          - Sid: BootstrapVersion
            Effect: Allow
            Action: ['ssm:GetParameter', 'ssm:GetParameters']
            Resource:
              - Fn::Sub: arn:aws:ssm:${DeploymentRegion}:${AWS::AccountId}:parameter/cdk-bootstrap/ctmprod/version
              - Fn::Sub: arn:aws:ssm:${DeploymentRegion}:${AWS::AccountId}:parameter/cdk-bootstrap/ctmtest/version
          - Sid: AssumeProjectCdkRoles
            Effect: Allow
            Action: ['sts:AssumeRole', 'sts:TagSession']
            Resource:
              - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmprod-*
              - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmtest-*
          - Sid: PassOnlyExecutionRolesToCloudFormation
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmprod-cfn-exec-role-${AWS::AccountId}-${DeploymentRegion}
              - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmtest-cfn-exec-role-${AWS::AccountId}-${DeploymentRegion}
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: WhoAmI
            Effect: Allow
            Action: sts:GetCallerIdentity
            Resource: '*'
          # Explicit denies win over any allow in any attached policy.
          - Sid: NoIdentityOrAccountChanges
            Effect: Deny
            Action:
              - 'iam:Add*'
              - 'iam:Attach*'
              - 'iam:Change*'
              - 'iam:Create*'
              - 'iam:Delete*'
              - 'iam:Detach*'
              - 'iam:Put*'
              - 'iam:Remove*'
              - 'iam:Set*'
              - 'iam:Tag*'
              - 'iam:Untag*'
              - 'iam:Update*'
              - 'iam:Upload*'
              - 'organizations:*'
              - 'account:*'
              - 'sso:*'
              - 'identitystore:*'
            Resource: '*'
          - Sid: NoSecurityFoundationChanges
            Effect: Deny
            NotAction:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
            Resource:
              - Fn::Sub: arn:aws:cloudformation:*:${AWS::AccountId}:stack/ctm-foundation/*
              - Fn::Sub: arn:aws:cloudformation:*:${AWS::AccountId}:stack/CDKToolkit-ctmprod/*
              - Fn::Sub: arn:aws:cloudformation:*:${AWS::AccountId}:stack/CDKToolkit-ctmtest/*
          - Sid: NoResourceImport
            Effect: Deny
            Action: ['cloudformation:CreateChangeSet', 'cloudformation:CreateStack', 'cloudformation:UpdateStack']
            Resource: '*'
            Condition:
              'Null':
                cloudformation:ImportResourceTypes: 'false'
          - Sid: StayInRegion
            Effect: Deny
            NotAction: ['cloudfront:*', 'iam:*', 'sts:*', 'acm:*']
            Resource: '*'
            Condition:
              StringNotEquals:
                aws:RequestedRegion: { Ref: DeploymentRegion }

  # Assumed through the time-machine-test profile. Can only reach the ctmtest CDK roles, publish
  # files to the test site bucket, invalidate the test distribution and read test stack status.
  TestOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ctm-test-operator
      Description: chugging.coffee Time Machine - routine test deployments
      MaxSessionDuration: 3600
      PermissionsBoundary: { Ref: PermissionsBoundary }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: { Ref: TrustedPrincipalArn } }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: operate-test
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UseTestCdkRoles
                Effect: Allow
                Action: ['sts:AssumeRole', 'sts:TagSession']
                Resource:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmtest-deploy-role-${AWS::AccountId}-${DeploymentRegion}
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmtest-file-publishing-role-${AWS::AccountId}-${DeploymentRegion}
              - Sid: ReadTestStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - Fn::Sub: arn:aws:cloudformation:${DeploymentRegion}:${AWS::AccountId}:stack/CtmTest-Site/*
              - Sid: PublishAndCleanTestSite
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketTagging
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - Fn::Sub: arn:aws:s3:::ctm-test-site-${AWS::AccountId}
                  - Fn::Sub: arn:aws:s3:::ctm-test-site-${AWS::AccountId}/*
                Condition:
                  StringEquals:
                    s3:ResourceAccount: { Ref: AWS::AccountId }
              - Sid: InvalidateTestDistribution
                Effect: Allow
                Action: ['cloudfront:CreateInvalidation', 'cloudfront:GetInvalidation', 'cloudfront:GetDistribution']
                Resource:
                  Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: chugging-time-machine
                    aws:ResourceTag/Environment: test
      Tags:
        - { Key: Project, Value: chugging-time-machine }
        - { Key: Environment, Value: test }
        - { Key: ManagedBy, Value: owner }

  ProdOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ctm-prod-operator
      Description: chugging.coffee Time Machine - routine production deployments
      MaxSessionDuration: 3600
      PermissionsBoundary: { Ref: PermissionsBoundary }
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: { Ref: TrustedPrincipalArn } }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: operate-prod
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UseProdCdkRoles
                Effect: Allow
                Action: ['sts:AssumeRole', 'sts:TagSession']
                Resource:
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmprod-deploy-role-${AWS::AccountId}-${DeploymentRegion}
                  - Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/cdk-ctmprod-file-publishing-role-${AWS::AccountId}-${DeploymentRegion}
              - Sid: ReadProdStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - Fn::Sub: arn:aws:cloudformation:${DeploymentRegion}:${AWS::AccountId}:stack/CtmProd-Site/*
                  - Fn::Sub: arn:aws:cloudformation:${DeploymentRegion}:${AWS::AccountId}:stack/CtmProd-Certificate/*
              - Sid: PublishAndCleanProdSite
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:GetBucketTagging
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - Fn::Sub: arn:aws:s3:::ctm-prod-site-${AWS::AccountId}
                  - Fn::Sub: arn:aws:s3:::ctm-prod-site-${AWS::AccountId}/*
                Condition:
                  StringEquals:
                    s3:ResourceAccount: { Ref: AWS::AccountId }
              - Sid: InvalidateProdDistribution
                Effect: Allow
                Action: ['cloudfront:CreateInvalidation', 'cloudfront:GetInvalidation', 'cloudfront:GetDistribution']
                Resource:
                  Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: chugging-time-machine
                    aws:ResourceTag/Environment: prod
              - Sid: ReadCertificateStatus
                Effect: Allow
                Action: ['acm:DescribeCertificate']
                Resource:
                  Fn::Sub: arn:aws:acm:${DeploymentRegion}:${AWS::AccountId}:certificate/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: chugging-time-machine
                    aws:ResourceTag/Environment: prod
      Tags:
        - { Key: Project, Value: chugging-time-machine }
        - { Key: Environment, Value: prod }
        - { Key: ManagedBy, Value: owner }

Outputs:
  PermissionsBoundaryArn:
    Value: { Ref: PermissionsBoundary }
  TestOperatorRoleArn:
    Value: { 'Fn::GetAtt': [TestOperatorRole, Arn] }
  ProdOperatorRoleArn:
    Value: { 'Fn::GetAtt': [ProdOperatorRole, Arn] }
